<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kabot-1 Mission Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6">
    <h1 class="text-2xl font-bold mb-6 text-blue-500">KABOT-1 DASHBOARD</h1>
    <p id="chart-status-output" class="mb-4 text-gray-400 text-sm">System Idle</p>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        {% for name, config in scripts_config.items() %}
        <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
            <h3 class="font-semibold mb-3">{{ config.title }}</h3>
            
            <div class="aspect-video bg-black rounded flex items-center justify-center overflow-hidden mb-4">
                {% if config.video_file %}
                    <video id="{{ name }}_player" class="w-full h-full" controls preload="metadata">
                        <source src="/video/{{ config.video_file }}" type="video/mp4">
                    </video>
                {% else %}
                    <img id="{{ name }}_chart" src="https://placehold.co/600x400/0d1117/30363d?text=No+Data" class="w-full h-full object-contain">
                {% endif %}
            </div>

            <button onclick="generateChart('{{ name }}')" 
                    class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded font-bold text-sm">
                GENERATE {{ "VIDEO" if config.video_file else "CHART" }}
            </button>
        </div>
        {% endfor %}
    </div>

    <script>
        const SCRIPTS_CONFIG = {{ scripts_config | tojson }};

        async function generateChart(name) {
            const status = document.getElementById('chart-status-output');
            const config = SCRIPTS_CONFIG[name];
            const isVideo = !!config.video_file;
            const endpoint = isVideo ? `/api/simulation/${name}` : `/api/chart/${name}`;

            status.textContent = `Processing ${name}...`;
            try {
                const res = await fetch(endpoint, { method: 'POST' });
                const data = await res.json();
                status.textContent = data.message;
                if (!isVideo) refreshMedia(name, `/chart/${config.chart_file}`);
            } catch (e) { status.textContent = "Server overloaded. Wait 5s."; }
        }

        function refreshMedia(name, url) {
            // Prevent the 404/null requests
            if (!url || url.includes('null') || url.includes('None')) return;
            
            const el = document.getElementById(`${name}_chart`);
            if (el) el.src = url + '?t=' + new Date().getTime();
        }

        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                Object.keys(data).forEach(key => {
                    const info = data[key];
                    // Only refresh if the logger is running and it's a CHART, not a video
                    if (info.running && info.chart_file && info.chart_file !== "None") {
                        refreshMedia(key, `/chart/${info.chart_file}`);
                    }
                });
            } catch (e) { console.log("Throttled..."); }
        }

        // 5 second interval is safer for 500MB RAM hardware
        setInterval(fetchStatus, 5000);
        window.onload = fetchStatus;
    </script>
</body>
</html>
