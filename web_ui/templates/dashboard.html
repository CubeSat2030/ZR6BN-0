<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kabot-1 HAB Mission Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom styles for a slightly more polished look */
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
    }
    .btn {
      transition: all 0.2s ease-in-out;
      border: 1px solid #30363d;
    }
    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    .status-box {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
        background-color: #0d1117;
        border: 1px solid #30363d;
        border-radius: 6px;
        min-height: 80px;
    }
    .chart-container img {
        border-radius: 6px;
        border: 1px solid #30363d;
        background-color: #0d1117;
    }
  </style>
</head>
<body class="p-4 sm:p-6 lg:p-8">

  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-white">Kabot-1 HAB Mission Console</h1>
      <p class="text-gray-400">Post-Flight Blackbox Analyzer</p>
    </header>

    <!-- Controls Section -->
    <section class="card p-6 mb-8">
      <h2 class="text-xl font-semibold mb-4 text-white">Chart Generation</h2>
      <div class="flex flex-wrap gap-4 items-center">
        <button id="btn-dht" onclick="generateChart('dht')" class="btn bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md">
          Generate DHT Chart
        </button>
        <button id="btn-mpu" onclick="generateChart('mpu')" class="btn bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md">
          Generate MPU6050 Chart
        </button>
        <button id="btn-sound" onclick="generateChart('sound')" class="btn bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded-md">
          Generate Sound Chart
        </button>
      </div>
      <div id="status-container" class="mt-5">
        <label class="font-semibold text-gray-300">Status:</label>
        <pre id="status_output" class="status-box p-3 text-sm text-gray-400 whitespace-pre-wrap">Awaiting commands...</pre>
      </div>
    </section>

    <!-- Charts Display Section -->
    <section class="card p-6">
      <h2 class="text-xl font-semibold mb-4 text-white">Generated Charts</h2>
      <div id="charts-grid" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="chart-container">
          <h3 class="font-semibold text-center mb-2 text-gray-300">DHT Sensor</h3>
          <img id="dht_chart" src="https://placehold.co/600x400/0d1117/30363d?text=No+Chart+Generated" alt="DHT Chart placeholder">
        </div>
        <div class="chart-container">
          <h3 class="font-semibold text-center mb-2 text-gray-300">MPU-6050 Sensor</h3>
          <img id="mpu_chart" src="https://placehold.co/600x400/0d1117/30363d?text=No+Chart+Generated" alt="MPU Chart placeholder">
        </div>
        <div class="chart-container">
          <h3 class="font-semibold text-center mb-2 text-gray-300">Sound Sensor</h3>
          <img id="sound_chart" src="https://placehold.co/600x400/0d1117/30363d?text=No+Chart+Generated" alt="Sound Chart placeholder">
        </div>
      </div>
    </section>

  </div>

  <script>
    const statusOutput = document.getElementById('status_output');
    const buttons = document.querySelectorAll('.btn');
    
    // Asynchronously generates a chart by calling the backend API
    async function generateChart(sensor) {
      const btn = document.getElementById(`btn-${sensor}`);
      statusOutput.textContent = `Requesting ${sensor.toUpperCase()} chart generation...`;
      statusOutput.classList.remove('text-red-400', 'text-green-400');
      statusOutput.classList.add('text-yellow-400');
      
      // Disable all buttons to prevent concurrent requests
      buttons.forEach(b => b.disabled = true);

      try {
        const response = await fetch(`/generate/${sensor}`);
        const data = await response.json();

        if (response.ok) {
          statusOutput.textContent = `Success: ${data.message}\nRefreshing chart view...`;
          statusOutput.classList.remove('text-yellow-400', 'text-red-400');
          statusOutput.classList.add('text-green-400');
          refreshChartImage(sensor, data.chart_url);
        } else {
          throw new Error(data.message || 'Unknown server error.');
        }
      } catch (error) {
        statusOutput.textContent = `Error: ${error.message}`;
        statusOutput.classList.remove('text-yellow-400', 'text-green-400');
        statusOutput.classList.add('text-red-400');
        console.error("Failed to generate chart:", error);
      } finally {
        // Re-enable all buttons after the operation is complete
        buttons.forEach(b => b.disabled = false);
      }
    }

    // Refreshes the specific image element to show the newly generated chart
    function refreshChartImage(sensor, url) {
      const imgElement = document.getElementById(`${sensor}_chart`);
      if (imgElement) {
        // Appending a timestamp to the URL (cache-busting) ensures the browser
        // fetches the latest version of the image instead of showing a cached one.
        imgElement.src = `${url}?t=${new Date().getTime()}`;
      }
    }
  </script>

</body>
</html>
