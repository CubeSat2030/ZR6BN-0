<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kabot-1 HAB Mission Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ===============================
       Custom Styles for Mission Control
       =============================== */
    :root {
      --bg-dark: #0d1117;
      --bg-card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .btn {
      transition: all 0.2s ease-in-out;
      border: 1px solid var(--border);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .status-box {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
      background-color: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      min-height: 80px;
      padding: 0.5rem;
    }

    .chart-container img {
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: var(--bg-dark);
    }

    /* Pulsing green/red shadow for active processes */
    .pulse-active-green { animation: pulse-shadow-green 1.5s infinite; }
    @keyframes pulse-shadow-green {
      0%, 100% { box-shadow: 0 0 5px rgba(0, 255, 0, 0.4); }
      50% { box-shadow: 0 0 10px rgba(0, 255, 0, 0.7); }
    }

    .pulse-active-red { animation: pulse-shadow-red 1.5s infinite; }
    @keyframes pulse-shadow-red {
      0%, 100% { box-shadow: 0 0 5px rgba(255, 0, 0, 0.4); }
      50% { box-shadow: 0 0 10px rgba(255, 0, 0, 0.7); }
    }

    /* Loading spinner */
    .loading-ring {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 
      0% { transform: rotate(0deg); } 
      100% { transform: rotate(360deg); } 
    }
  </style>
</head>
<body class="p-4 sm:p-6 lg:p-8">
  <!-- Floating Alert Container -->
  <div id="alert-container" class="fixed top-4 right-4 z-50 space-y-2 max-w-sm w-full"></div>

  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-white">Kabot-1 Mission Control Dashboard</h1>
      <p class="text-gray-300">Manage scripts, generate charts, and control the Pi payload.</p>
    </header>

    <!-- Subsystem Status -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
      <div class="card p-4 flex items-center justify-between">
        <span>Telemetry</span>
        <div class="w-4 h-4 rounded-full bg-green-500 pulse-active-green"></div>
      </div>
      <div class="card p-4 flex items-center justify-between">
        <span>Logging</span>
        <div class="w-4 h-4 rounded-full bg-red-500 pulse-active-red"></div>
      </div>
      <div class="card p-4 flex items-center justify-between">
        <span>Uplink</span>
        <div class="loading-ring"></div>
      </div>
    </section>

    <!-- Event Log -->
    <section class="mb-8">
      <h2 class="text-xl font-semibold mb-2">Event Log</h2>
      <div class="status-box overflow-y-auto">
        <p>[00:00:01] Mission Control Initialized</p>
        <p>[00:00:05] Telemetry link established</p>
      </div>
    </section>

    <!-- Chart Section -->
    <section>
      <h2 class="text-xl font-semibold mb-2">Telemetry Charts</h2>
      <div class="chart-container grid grid-cols-1 sm:grid-cols-2 gap-4">
        <img src="https://via.placeholder.com/400x200?text=Altitude+Chart" alt="Altitude Chart">
        <img src="https://via.placeholder.com/400x200?text=Temperature+Chart" alt="Temperature Chart">
      </div>
    </section>
  </div>
</body>
</html>
