<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabot-1 Mission Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'gray-900': '#0d1117',
                        'gray-800': '#161b22',
                        'gray-700': '#21262d',
                        'gray-600': '#30363d',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
        }
        body { background-color: var(--bg-dark); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; }
        .btn { transition: all 0.2s ease-in-out; border: 1px solid var(--border); }
        .btn:disabled { cursor: not-allowed; opacity: 0.5; }
        .status-box { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; background-color: var(--bg-dark); border: 1px solid var(--border); border-radius: 6px; min-height: 80px; padding: 0.5rem; }
        .chart-container img { border-radius: 6px; border: 1px solid var(--border); background-color: var(--bg-dark); height: auto; width: 100%; }
       
        /* VIDEO CONTAINER */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
        }
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--bg-dark);
        }
        /* Pulsing */
        .pulse-active-green { animation: pulse-shadow-green 1.5s infinite; }
        @keyframes pulse-shadow-green { 0%, 100% { box-shadow: 0 0 5px rgba(0, 255, 0, 0.4); } 50% { box-shadow: 0 0 10px rgba(0, 255, 0, 0.7); } }
        .pulse-active-red { animation: pulse-shadow-red 1.5s infinite; }
        @keyframes pulse-shadow-red { 0%, 100% { box-shadow: 0 0 5px rgba(255, 0, 0, 0.4); } 50% { box-shadow: 0 0 10px rgba(255, 0, 0, 0.7); } }
        #power-icon-btn { cursor: pointer; padding: 0.5rem; border-radius: 50%; transition: background-color 0.2s, box-shadow 0.3s; fill: var(--text); border: none; background-color: transparent; }
        #power-icon-btn:hover { background-color: rgba(201, 209, 217, 0.1); }
        .pulse-warning-yellow { animation: pulse-shadow-yellow 2s infinite; }
        @keyframes pulse-shadow-yellow { 0%, 100% { box-shadow: 0 0 8px rgba(234, 179, 8, 0.5); } 50% { box-shadow: 0 0 16px rgba(234, 179, 8, 0.8); } }
        .pulse-critical-red { animation: pulse-shadow-red-fast 1s infinite; }
        @keyframes pulse-shadow-red-fast { 0%, 100% { box-shadow: 0 0 8px rgba(220, 38, 38, 0.6); } 50% { box-shadow: 0 0 16px rgba(220, 38, 38, 0.9); } }
        .loading-ring { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #heartbeat-icon { transition: color 0.5s ease-in-out; transform-origin: center; }
        .heartbeat-standby { animation: double-beat 10s infinite; }
        @keyframes double-beat { 0%, 20%, 100% { transform: scale(1); } 5%, 15% { transform: scale(1.25); } 10% { transform: scale(1); } }
        .heartbeat-warning { animation: pulse-beat 1.5s infinite; }
        @keyframes pulse-beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
    </style>
</head>
