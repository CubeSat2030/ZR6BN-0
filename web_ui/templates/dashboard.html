<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flight Logger – Flight Lock</title>

<style>
body {
    background: #0b0f14;
    color: #d0d7de;
    font-family: monospace;
    padding: 20px;
}

h1 { color: #58a6ff; }

.locked {
    color: #ff7b72;
    font-weight: bold;
}

.unlocked {
    color: #3fb950;
    font-weight: bold;
}

select, button {
    background: #161b22;
    color: #d0d7de;
    border: 1px solid #30363d;
    padding: 6px;
    margin-top: 8px;
}

pre {
    background: #020409;
    border: 1px solid #30363d;
    padding: 10px;
    margin-top: 15px;
    max-height: 450px;
    overflow: auto;
    font-size: 12px;
}

.footer {
    margin-top: 10px;
    font-size: 11px;
    color: #8b949e;
}
</style>
</head>

<body>

<h1>🚀 Raw Flight Logger</h1>

<div id="lockStatus">Checking flight state…</div>

<select id="fileSelect" disabled></select><br>

<button id="downloadBtn" disabled>Download TXT</button>

<pre id="previewBox">Awaiting flight state.</pre>

<div class="footer">
    Flight Lock enforces immutable post-flight data
</div>

<script>
const lockStatus = document.getElementById("lockStatus");
const fileSelect = document.getElementById("fileSelect");
const previewBox = document.getElementById("previewBox");
const downloadBtn = document.getElementById("downloadBtn");

async function loadState() {
    const state = await (await fetch("/api/state")).json();

    if (state.locked) {
        lockStatus.innerHTML =
            `🔒 FLIGHT LOCKED <span class="locked">(locked at ${state.locked_at})</span>`;
    } else {
        lockStatus.innerHTML =
            `🔓 FLIGHT UNLOCKED <span class="unlocked">(live access)</span>`;
    }

    loadFiles();
}

async function loadFiles() {
    const res = await fetch("/api/logs");
    const data = await res.json();

    fileSelect.disabled = false;
    fileSelect.innerHTML = '<option value="">Select log file…</option>';

    data.files.forEach(f => {
        const opt = document.createElement("option");
        opt.value = f;
        opt.textContent = f;
        fileSelect.appendChild(opt);
    });
}

fileSelect.addEventListener("change", async () => {
    const filename = fileSelect.value;
    if (!filename) return;

    previewBox.textContent = "Loading…";
    downloadBtn.disabled = true;

    const res = await fetch(`/api/logs/preview/${filename}`);
    const data = await res.json();

    previewBox.textContent =
        data.content + (data.truncated ? "\n\n[... truncated ...]" : "");

    downloadBtn.onclick = () => {
        window.location = `/download/log/${filename}`;
    };
    downloadBtn.disabled = false;
});

loadState();
</script>

</body>
</html>
